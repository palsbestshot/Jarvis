name: jarvis
description: JARVIS v2 â€” Personal AI Assistant
publish_to: 'none'
version: 1.0.0+17

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  
  # Firebase
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4
  firebase_auth: ^5.3.1
  firebase_messaging: ^15.1.3
  firebase_storage: ^12.3.2
  
  # AI APIs (HTTP calls)
  http: ^1.2.2
  
  # Audio
  flutter_sound: ^9.2.13
  audioplayers: ^6.1.0
  permission_handler: ^11.3.1
  
  # Storage & prefs
  shared_preferences: ^2.3.2
  
  # Utilities
  intl: ^0.19.0
  uuid: ^4.5.0
  path_provider: ^2.1.4
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4
  image_picker: ^1.1.2

  # Deep-link launcher â€” used by the 1-click Outlook draft flow
  # (ms-outlook://compose?draftId=...), tel: one-tap dialling from task
  # sheets, and any future external URIs.
  url_launcher: ^6.3.1

  # Device address-book access â€” used by Settings to map each
  # subordinate/boss name to a phone number, so the task sheet can
  # show a phone icon that one-taps into the dialler.
  flutter_contacts: ^1.1.9+2

  # File picker â€” used by the Goals tab to attach the source .docx
  # (HVAC roadmap) to a goal. Firebase Storage is already wired in via
  # firebase_storage above.
  file_picker: ^8.1.2

  # Android home-screen widget â€” shows today's task progress + tap-to-open.
  home_widget: ^0.6.0

  # Share sheet â€” used by the Time section's CSV export so visits can be
  # emailed, pushed to Drive, or pasted into a CRM.
  share_plus: ^10.0.0

  # Dish thumbnails - Rakhi's Meals picker renders a 2-col grid of dish
  # cards; each card shows a picture from Openverse/Wikipedia (see
  # dish_image_service.dart). CachedNetworkImage handles memory +
  # on-disk caching so the picker stays smooth even on slow networks.
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12
  riverpod_generator: ^2.4.3

flutter:
  uses-material-design: true
  fonts:
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans-Regular.ttf
        - asset: assets/fonts/DMSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/DMSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/DMSans-Bold.ttf
          weight: 700
    - family: InstrumentSerif
      fonts:
        - asset: assets/fonts/InstrumentSerif-Regular.ttf
        - asset: assets/fonts/InstrumentSerif-Italic.ttf
          style: italic
  assets:
    - assets/fonts/
    - assets/images/
    - env.json