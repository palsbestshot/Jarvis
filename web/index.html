<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Rakhi's personal assistant — tasks, meals, thoughts.">
  <!--
    No `viewport-fit=cover` on purpose. With cover, iOS lets the PWA
    content render edge-to-edge (under the notch + home-indicator), and
    Flutter Web's glass-pane canvas fills the *full* viewport including
    the safe-area strips. iOS then visually masks the strips but pointer
    events still land at y=0 of the canvas — result: you tap the visible
    icon and hit a coordinate ~47px too low (top) or a gesture area
    (bottom). Without cover, iOS constrains the PWA viewport to the
    visible-safe region and Flutter's canvas naturally aligns with it.
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#D47BA0">

  <!-- iOS PWA meta tags. `apple-mobile-web-app-capable` is the legacy
       tag iOS 16.x still respects; `mobile-web-app-capable` is the
       modern one. Both need to be set so Rakhi's "Add to Home Screen"
       launches standalone (no Safari chrome).

       Status bar style = `default` (not black-translucent) because the
       translucent setting combined with no-viewport-fit-cover causes
       iOS to overlap the status bar with the PWA content, triggering
       the exact touch-offset bug above. `default` gives iOS a real
       reserved strip for the status bar, so Flutter's canvas lives
       cleanly below it. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Jarvis">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Jarvis</title>
  <link rel="manifest" href="manifest.json">

  <!-- Minimal CSS reset. No safe-area-inset padding here anymore — once
       viewport-fit=cover is off, iOS constrains the viewport to the
       safe region itself, and adding our own padding would double-pad
       and re-create the offset bug. touch-action=manipulation disables
       Safari's double-tap-to-zoom delay. -->
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      background-color: #FFF5F8;
    }
  </style>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
