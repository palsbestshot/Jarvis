<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Rakhi's personal assistant — tasks, meals, thoughts.">
  <!--
    viewport-fit=cover: content CAN render under the notch + home
    indicator (we want that, so we can paint a pretty gradient strip
    there). The previously-reported touch-offset bug is NOT caused by
    viewport-fit itself — it's caused by Flutter Web's flutter-view
    element being position:fixed to the *full* viewport so its touch
    hit-test runs edge-to-edge while the user visually sees content
    masked by iOS system UI. We now override flutter-view's CSS to
    inset it by env(safe-area-inset-*), so visual and tap positions
    align, AND we paint our own gradient+sparkle design in the reserved
    strips around it.
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#D47BA0">

  <!-- iOS PWA meta tags. `apple-mobile-web-app-capable` is the legacy
       tag iOS 16.x still respects; `mobile-web-app-capable` is the
       modern one. Both need to be set so Rakhi's "Add to Home Screen"
       launches standalone (no Safari chrome).

       black-translucent = iOS overlays only the status bar icons onto
       whatever we paint underneath. Combined with our gradient strip
       below, Rakhi sees a continuous dark-rose band from the notch
       down through her content. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Jarvis">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Jarvis</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      background-color: #FFF5F8;
    }

    /*
      TOP GRADIENT STRIP — covers the iPhone notch / Dynamic Island area.
      Uses a diagonal rose → pink gradient with 4 soft white sparkles
      sprinkled across it for a subtle feminine touch. The strip is
      sized to safe-area-inset-top (0 on desktop, ~47px on iPhone 13
      PWA, ~59px on Pro Max).

      pointer-events: none + z-index above Flutter's canvas so the
      design shows on top but taps that somehow land here (shouldn't
      happen once we inset flutter-view below) fall through harmlessly.
    */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: env(safe-area-inset-top, 0px);
      background:
        radial-gradient(circle at 15% 50%, rgba(255,255,255,0.28) 0%, transparent 2.5%),
        radial-gradient(circle at 42% 30%, rgba(255,255,255,0.22) 0%, transparent 2%),
        radial-gradient(circle at 68% 65%, rgba(255,255,255,0.28) 0%, transparent 2.5%),
        radial-gradient(circle at 90% 35%, rgba(255,255,255,0.22) 0%, transparent 2%),
        linear-gradient(135deg, #8B3A5C 0%, #B25078 45%, #D47BA0 100%);
      z-index: 1000;
      pointer-events: none;
    }

    /*
      BOTTOM STRIP — covers the iPhone home-indicator area.
      Lighter gradient blending down into the app's light-pink
      background, plus 3 sparkles. Again pointer-events: none.
    */
    body::after {
      content: '';
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: env(safe-area-inset-bottom, 0px);
      background:
        radial-gradient(circle at 25% 40%, rgba(255,255,255,0.3) 0%, transparent 3%),
        radial-gradient(circle at 55% 70%, rgba(255,255,255,0.22) 0%, transparent 2.5%),
        radial-gradient(circle at 82% 30%, rgba(255,255,255,0.3) 0%, transparent 3%),
        linear-gradient(0deg, #E8A6C0 0%, #F4CFDF 60%, #FFF5F8 100%);
      z-index: 1000;
      pointer-events: none;
    }

    /*
      Wrapper div we tell Flutter to render *inside* via the hostElement
      config. Positioned to the safe-area inset on every side so the
      Flutter canvas is naturally constrained to the visible viewport.
      Taps inside the canvas land on the visible widget; taps in the
      safe-area strips fall through to our body pseudo-elements (which
      are pointer-events:none and decorative).

      IMPORTANT: this relies on scripts/deploy-web.ps1 patching
      build/web/flutter_bootstrap.js after `flutter build web` to pass
      config.hostElement to _flutter.loader.load(). Without that patch
      Flutter falls back to document.body and the fallback CSS override
      below (flutter-view/flt-glass-pane) kicks in. The ps1 patch is
      more reliable because Flutter applies inline styles at runtime
      that out-specificity the CSS rule, even with !important on every
      declaration.
    */
    #flutter-root {
      position: fixed;
      top: env(safe-area-inset-top, 0px);
      left: env(safe-area-inset-left, 0px);
      right: env(safe-area-inset-right, 0px);
      bottom: env(safe-area-inset-bottom, 0px);
      overflow: hidden;
    }

    /*
      Belt-and-braces fallback: if Flutter ignores hostElement (old
      build, patch missed, renderer differs) and falls back to document
      .body, override its flutter-view / flt-glass-pane children to
      inset the same way. Less reliable than the hostElement route
      (Flutter can re-apply inline styles at runtime) but better than
      nothing.
    */
    flutter-view,
    flt-glass-pane {
      position: fixed !important;
      top: env(safe-area-inset-top, 0px) !important;
      left: env(safe-area-inset-left, 0px) !important;
      right: env(safe-area-inset-right, 0px) !important;
      bottom: env(safe-area-inset-bottom, 0px) !important;
      width: auto !important;
      height: auto !important;
    }
  </style>
</head>
<body>
  <!--
    The #flutter-root div is the hostElement Flutter will render inside.
    Placed BEFORE the flutter_bootstrap.js script so that by the time
    the loader runs, the element exists and the (patched) bootstrap
    can query it.
  -->
  <div id="flutter-root"></div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
