<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Rakhi's personal assistant — tasks, meals, thoughts.">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#D47BA0">

  <!-- iOS PWA meta tags. `apple-mobile-web-app-capable` is the legacy
       tag iOS 16.x still respects; `mobile-web-app-capable` is the
       modern one. Both need to be set so Rakhi's "Add to Home Screen"
       launches standalone (no Safari chrome). -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Jarvis">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Jarvis</title>
  <link rel="manifest" href="manifest.json">

  <!--
    iOS PWA touch-offset fix. Without this, buttons near the top of the
    screen require tapping a few pixels ABOVE the visible icon.

    Cause: apple-mobile-web-app-status-bar-style=black-translucent plus
    viewport-fit=cover tells iOS to let the PWA content render
    edge-to-edge, including under the status bar / notch. Flutter's
    canvas fills the entire viewport and attaches pointer events at
    those coordinates. But iOS reserves its own safe area for system UI,
    and the VISIBLE content gets pushed down by safe-area-inset-top while
    the canvas's internal coordinate system still starts at y=0. Result:
    visual button is at y=200, hit target is at y=150.

    Fix: pad the body by safe-area-inset-{top,bottom,left,right}. The
    Flutter canvas now sizes to the visible area only; visual and tap
    positions line up. Also explicitly zero html/body margins since
    Safari defaults to 8px.
  -->
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overscroll-behavior: none;
    }
    body {
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      padding-left: env(safe-area-inset-left, 0px);
      padding-right: env(safe-area-inset-right, 0px);
      background-color: #FFF5F8;
    }
  </style>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
